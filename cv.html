<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victor Mascaro · CV</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/brand/favicon/favicon.ico" sizes="32x32">
<link rel="icon" href="assets/brand/favicon/favicon.svg" type="image/svg+xml">
<style>
  /* Printable CV, rendered to PDF (A4). Content comes from assets/js/content.js.
     Kept simple for recruiters and applicant-tracking systems: one text font (the brand font only for the name),
     three sizes (name, headings, body), two text colours (dark and blue), contact details at the top, and
     nothing positioned or letter-spaced inside text, so the PDF's text reads in the order it's laid out. */
  @font-face { font-family: 'Bricolage Grotesque'; src: url('assets/fonts/bricolage-grotesque-latin-standard-normal.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
  @font-face { font-family: 'Instrument Sans'; src: url('assets/fonts/instrument-sans-latin-standard-normal.woff2') format('woff2'); font-weight: 400 700; }
  :root { --ink: #0B1530; --accent: #0B63C9; --line: #D2DCEB; --gold: #F2B705; --paper: #FFFFFF; --t-name: 24pt; --t-head: 10.5pt; --t-body: 8.8pt; }
  @page { size: A4; margin: 11mm 14mm 9mm 14mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E1E9F5; color: var(--ink); }
  body { font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: var(--t-body); line-height: 1.36; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 210mm; min-height: 297mm; margin: 24px auto; padding: 14mm 15mm; background: var(--paper); box-shadow: 0 10px 40px rgba(11, 18, 32, .15); }
  @media print { html, body { background: #fff; } .page { margin: 0; padding: 0; width: auto; min-height: 0; box-shadow: none; } .noprint { display: none; } }
  h1, h2, h3 { margin: 0; font-size: inherit; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  a { color: var(--accent); text-decoration: none; }
  .head { display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: end; padding-bottom: 3.5mm; border-bottom: 2px solid var(--accent); }
  .name { font-family: 'Bricolage Grotesque', 'Avenir Next', sans-serif; font-size: var(--t-name); font-weight: 750; line-height: .95; letter-spacing: -.035em; }
  .role { font-size: var(--t-head); font-weight: 600; margin-top: 2mm; color: var(--accent); }
  .role span { color: var(--ink); font-weight: 500; }
  .contact { text-align: right; line-height: 1.4; }
  .summary { margin: 3.5mm 0 0; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 54mm; gap: 8mm; margin-top: 3mm; }
  .sec-t { font-weight: 700; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 2mm; margin: 3.5mm 0 1.6mm; }
  .sec-t::before { content: ""; width: 1.8mm; height: 1.8mm; background: var(--gold); transform: rotate(45deg); flex: none; }
  .job { padding: 1.8mm 0; border-top: 1px solid var(--line); break-inside: avoid; }
  .job:first-of-type { border-top: 0; padding-top: 0; }
  .job-h { display: flex; justify-content: space-between; gap: 4mm; align-items: baseline; }
  .job-org { font-size: var(--t-head); font-weight: 700; }
  .job-role { font-weight: 600; }
  .job-role span { font-weight: 400; }
  .job ul { margin-top: 1mm; display: grid; gap: .5mm; }
  /* a hanging diamond drawn inline: nothing positioned, so each bullet's text stays with its job in the PDF */
  .job li { padding-left: 3.4mm; text-indent: -3.4mm; }
  .job li::before { content: ""; box-sizing: border-box; display: inline-block; width: 1.3mm; height: 1.3mm; margin-right: 2.1mm; border: 1px solid var(--gold); transform: rotate(45deg); vertical-align: .18em; }   /* 1.3 + 2.1 = the 3.4mm indent, border included, so the first line lines up with the rest */
  .side .block + .block { margin-top: .5mm; }
  .metric { display: grid; grid-template-columns: 9mm 1fr; column-gap: 2.6mm; padding: 1.2mm 0; border-top: 1px solid var(--line); align-items: baseline; }
  .metric:first-child { border-top: 0; }
  .metric b { font-size: var(--t-head); font-weight: 700; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
  .edu { padding: 1mm 0; border-top: 1px solid var(--line); line-height: 1.32; }
  .edu:first-child { border-top: 0; }
  .edu b { display: block; }
  .edu span { display: block; }
  .edu i, .job-when { font-style: normal; white-space: nowrap; }   /* a date range never breaks across lines */
  .langs { display: grid; gap: 1mm; }
  .langs li { display: flex; align-items: center; gap: 2mm; }
  .langs img { width: 4.6mm; height: 3.2mm; border-radius: .6mm; object-fit: cover; box-shadow: 0 0 0 .2mm var(--line); flex: none; }
  /* the separator dot: a little bolder than the text, with a normal space on each side */
  span.sep { display: inline; font-weight: 700; }
  .tags { display: flex; flex-wrap: wrap; gap: 1.2mm; }
  .tags li { padding: .3mm 1.6mm; border: 1px solid var(--line); border-radius: 1.2mm; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) 54mm; gap: 8mm; border-top: 1px solid var(--line); margin-top: 2mm; }
  .row2 .sec-t { margin-top: 3mm; }
  .noprint { text-align: center; padding: 16px; font: 14px system-ui; }
  .noprint button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<p class="noprint"><button type="button" onclick="window.print()">Print / Save as PDF</button></p>
<div class="page" id="cv"></div>
<script src="assets/js/content.js"></script>
<script>
(function () {
  var C = window.CONTENT;
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') === 'pt' ? 'pt' : 'en';
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  function L(v) { return typeof v === 'string' ? v : (v[lang] || v.en); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  var T = {
    en: { title: 'UX/AI Designer', sub: 'Game systems, gamification & AI', sum: 'UX/AI designer with five years across mobile games and fintech. At Knomee, a fintech for financial advisors, I design the client app’s gamified Adventures and the advisor dashboard, and I built the coded prototype the team uses for handoff, sales demos and user tests. Before that, I designed systems, live ops and onboarding for four mobile games at By Aliens. I design for AI and with it, and I prototype in code with Claude Code.', exp: 'Experience', res: 'Highlights', edu: 'Education', tools: 'Tools & skills', langs: 'Languages', langsV: 'Portuguese (native) · English (professional)', loc: 'São Paulo, Brazil · UTC−3 · Remote' },
    pt: { title: 'UX/AI Designer', sub: 'Sistemas de jogo, gamificação e IA', sum: 'UX/AI designer com cinco anos entre jogos mobile e fintech. Na Knomee, uma fintech para assessores financeiros, desenho as Adventures gamificadas do app do cliente e o dashboard do assessor, e construí o protótipo em código que o time usa em handoff, demos de vendas e testes com usuários. Antes, na By Aliens, desenhei sistemas, live ops e onboarding para quatro jogos mobile. Desenho para IA e com IA, e prototipo em código com o Claude Code.', exp: 'Experiência', res: 'Destaques', edu: 'Formação', tools: 'Ferramentas e habilidades', langs: 'Idiomas', langsV: 'Português (nativo) · Inglês (profissional)', loc: 'São Paulo, Brasil · UTC−3 · Remoto' }
  }[lang];
  var site = 'victor-mascaro-ux.github.io/my-portfolio';
  var results = [
    ['643', { en: 'merged PRs on the Knomee coded prototype', pt: 'PRs mergeados no protótipo em código da Knomee' }],
    ['58', { en: 'screens across advisor, firm and client views (Knomee)', pt: 'telas nas visões de assessor, empresa e cliente (Knomee)' }],
    ['5', { en: 'gamified Adventures in the Knomee client app', pt: 'Adventures gamificadas no app do cliente da Knomee' }],
    ['6', { en: 'commercial games and apps I’ve worked on', pt: 'jogos e apps comerciais em que trabalhei' }],
    ['15', { en: 'games I made in university and at game jams, as game producer, game designer and level designer', pt: 'jogos que fiz na faculdade e em game jams, como produtor de jogos, game designer e level designer' }]
  ];
  var tools = { en: ['Figma', 'Prototyping in code', 'React + TypeScript', 'HTML / CSS / JS', 'Design systems', 'UX research', 'Game economy', 'Unity + C#', 'Claude Code', 'Claude Design'], pt: ['Figma', 'Prototipação em código', 'React + TypeScript', 'HTML / CSS / JS', 'Design systems', 'Pesquisa de UX', 'Economia de jogos', 'Unity + C#', 'Claude Code', 'Claude Design'] }[lang];
  // education, newest first: by the month it ended, then the month it started
  var MONTHS = 'JanFebMarAprMayJunJulAugSepOctNovDec';
  var years = function (s) {
    var w = typeof s.when === 'string' ? s.when : s.when.en, d = [];
    w.replace(/(?:([A-Z][a-z]{2}) )?(\d{4})/g, function (_, m, y) { d.push(+y * 12 + (m ? MONTHS.indexOf(m) / 3 : 0)); });
    if (/now/.test(w)) d.push(Infinity);   // a job that's still going ends last
    return d.length ? [d[d.length - 1], d[0]] : [0, 0];
  };
  var newestFirst = function (a, b) { var ya = years(a), yb = years(b); return (yb[0] - ya[0]) || (yb[1] - ya[1]); };
  // jobs, newest first, the same way: by the month each ended, then the month it started
  var jobs = C.experience.slice().sort(newestFirst);
  var inProgress = C.skills.filter(function (s) { return s.status === 'progress'; });
  var edu = C.skills.filter(function (s) { return s.status === 'done'; }).slice().sort(newestFirst).map(function (s) {
    var when = typeof s.when === 'string' ? s.when : L(s.when);
    return '<div class="edu"><b>' + esc(L(s.name)) + '</b><span>' + esc(L(s.kind)) + ' · <i>' + esc(when) + '</i></span></div>';
  }).join('');
  if (inProgress.length) edu = '<div class="edu"><b>' + (lang === 'pt' ? 'Cursando (2025 –)' : 'In progress (2025 –)') + '</b><span>' +
    inProgress.map(function (s) { return esc(L(s.name)); }).join(' · ') + '</span></div>' + edu;
  // contact details at the top, where recruiters and parsers look first: place, email, phone, LinkedIn, portfolio
  var linkedin = C.person.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  var contact = [esc(T.loc),
    '<a href="mailto:' + esc(C.person.email) + '">' + esc(C.person.email) + '</a>' + (C.person.phone ? ' · <a href="tel:' + esc(C.person.phone.replace(/[^\d+]/g, '')) + '">' + esc(C.person.phone) + '</a>' : ''),
    '<a href="' + esc(C.person.linkedin) + '">' + esc(linkedin) + '</a>',
    '<a href="https://' + site + '">' + site + '</a>'].join('<br>');
  var html =
    '<header class="head"><div><h1 class="name">Victor Mascaro</h1><p class="role">' + T.title + '<span> · ' + T.sub + '</span></p></div>' +
    '<p class="contact">' + contact + '</p></header>' +
    '<p class="summary">' + esc(T.sum) + '</p>' +
    '<div class="grid"><section><h2 class="sec-t">' + T.exp + '</h2>' +
    jobs.map(function (x) {
      return '<article class="job"><div class="job-h"><h3 class="job-org">' + esc(x.org) + '</h3><span class="job-when">' + esc(L(x.when)) + '</span></div>' +
        '<p class="job-role">' + esc(L(x.role)) + '<span> · ' + esc(L(x.where)) + '</span></p>' +
        '<ul>' + x.points[lang].map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></article>';
    }).join('') + '</section>' +
    '<aside class="side"><div class="block"><h2 class="sec-t">' + T.res + '</h2>' + results.map(function (r) { return '<div class="metric"><b>' + r[0] + '</b><span>' + esc(L(r[1])) + '</span></div>'; }).join('') + '</div>' +
    '<div class="block"><h2 class="sec-t">' + T.edu + '</h2>' + edu + '</div></aside></div>' +
    '<div class="row2"><div><h2 class="sec-t">' + T.tools + '</h2><ul class="tags">' + tools.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
    '<div><h2 class="sec-t">' + T.langs + '</h2><ul class="langs">' + T.langsV.split(' · ').map(function (l, i) {
      return '<li><img src="assets/img/flags/' + ['br.webp', 'us.svg'][i] + '" alt="" width="20" height="14">' + esc(l) + '</li>';
    }).join('') + '</ul></div></div>';
  document.getElementById('cv').innerHTML = html;

  // every " · " becomes a span, so the dot can be drawn a little bolder (the text stays " · ")
  function sepify(rootNode) {
    var walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT), hits = [];
    for (var n; (n = walker.nextNode());) {
      var el = n.parentElement;
      if (n.nodeValue.indexOf(' · ') >= 0 && el && !el.closest('script, style, textarea, .tw, .sep')) hits.push(n);
    }
    hits.forEach(function (n) {
      var frag = document.createDocumentFragment();
      n.nodeValue.split(' · ').forEach(function (part, i) {
        if (i) { var s = document.createElement('span'); s.className = 'sep'; s.textContent = ' · '; frag.appendChild(s); }
        if (part) frag.appendChild(document.createTextNode(part));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  sepify(document.getElementById('cv'));
})();
</script>
</body>
</html>
