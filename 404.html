<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest not found · Victor Mascaro</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/my-portfolio/assets/brand/favicon/favicon.ico" sizes="32x32">
<link rel="icon" href="/my-portfolio/assets/brand/favicon/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/my-portfolio/assets/fonts/bricolage-grotesque-latin-standard-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Instrument Sans'; src: url('/my-portfolio/assets/fonts/instrument-sans-latin-standard-normal.woff2') format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/my-portfolio/assets/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  :root { --paper: #EEF3FA; --ink: #0B1530; --muted: #4F5F82; --dot: rgba(11, 21, 48, .12); --blue: #0B63C9; --on-blue: #FFFFFF; --gold: #F2B705; --note: #FFD84D; --note-ink: #382800; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0A1430; --ink: #EEF3FF; --muted: #8E9CC2; --dot: rgba(120, 170, 255, .10); --blue: #4FC3F7; --on-blue: #06122B; color-scheme: dark; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--paper) radial-gradient(var(--dot) 1px, transparent 1.3px) 0 0 / 24px 24px; color: var(--ink);
    font-family: 'Instrument Sans', system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  main { display: grid; gap: 18px; max-width: 34rem; }
  .code { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .1em; color: var(--muted); font-size: .8rem; text-transform: uppercase; }
  h1 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; letter-spacing: -.035em; margin: 0; }
  p { margin: 0; line-height: 1.6; color: var(--muted); }
  a { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 12px; background: var(--blue); color: var(--on-blue); text-decoration: none; font-weight: 600; }
  .note { justify-self: start; background: var(--note); color: var(--note-ink); padding: 12px 16px; border-radius: 4px 4px 4px 14px; transform: rotate(-1deg); font-size: .9rem; box-shadow: 0 14px 30px -12px rgba(0,0,0,.4); }
</style>
</head>
<body>
<main>
  <p class="code">Error 404 · Quest not found</p>
  <h1>This path leads off the map.</h1>
  <p>The page you were looking for doesn’t exist, or it moved. Esta página não existe ou mudou de endereço.</p>
  <p class="note">Design note: a 404 should get you home in one click and never blame you.</p>
  <a href="/my-portfolio/">← Back to the portfolio</a>
</main>
</body>
</html>
